<!doctype html>
<html lang="hi" data-theme="teak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a0673b">
  <meta name="description" content="Apne saare kapde ek jagah — ghar, flat, kahin bhi. Wardrobe app with almirah, search and community.">
  <title>Wardrobe — Meri Almirah</title>
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('wardrobe.theme')) || 'teak'; } catch (e) {}
  </script>
</head>
<body>
  <div class="splash" id="splash"><img class="logo" src="icons/logo.svg" alt=""></div>
  <div id="app"></div>
  <div id="toast" aria-live="polite"></div>
  <script src="assets/js/config.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
