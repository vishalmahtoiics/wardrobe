name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['public/**', 'mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already ships the Android SDK; just make sure licenses are accepted.
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy web UI into the app
        env:
          # Set this in Settings → Secrets and variables → Actions → Variables (e.g. https://wardrobe.yourdomain.com).
          # If empty, the app asks for the server address on first launch.
          WARDROBE_API_URL: ${{ vars.WARDROBE_API_URL }}
        run: node scripts/prepare-www.js

      - name: Create Android project
        run: npx cap add android

      - name: App icon & splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#f1dcc4' --splashBackgroundColor '#f7efe4'

      - name: Permissions
        run: node scripts/patch-android.js

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../Wardrobe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wardrobe-apk
          path: Wardrobe.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Wardrobe APK (build ${{ github.run_number }})
          make_latest: true
          body: |
            📱 Android APK — download `Wardrobe.apk` below and install it on your phone
            (allow "Install unknown apps" for your browser / file manager).
            Commit: ${{ github.sha }}
          files: Wardrobe.apk
